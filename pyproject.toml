[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adk-aerospike"
version = "0.0.1"
description = "Aerospike-backed Session, Memory, and Artifact services for Google Agent Development Kit (ADK)."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Aerospike, Inc." },
]
requires-python = ">=3.11"
keywords = ["adk", "google-adk", "aerospike", "agents", "llm", "memory", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "google-adk >= 1.23",
    "aerospike >= 15",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8",
    "pytest-asyncio >= 0.23",
    "pytest-timeout >= 2",
    "testcontainers >= 4",
    "ruff >= 0.6",
    "mypy >= 1.10",
]

[project.urls]
Homepage = "https://github.com/aerospike/adk-aerospike"
Repository = "https://github.com/aerospike/adk-aerospike"
Issues = "https://github.com/aerospike/adk-aerospike/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/adk_aerospike"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
